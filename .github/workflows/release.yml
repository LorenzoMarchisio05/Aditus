name: release
on:
  push:
    tags: ['v*']

jobs:
  macos:
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      CEF_PATH: ${{ github.workspace }}/cef
      # Optional: "Developer ID Application: Name (TEAMID)". Unsigned build when unset.
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: |
          scripts/fetch-cef.sh "$CEF_PATH"
          brew install ninja
          cargo install cef --version =156.1.0 --features build-util --bin bundle-cef-app
      - run: npm ci
        working-directory: ui
      - name: Tag matches app version
        run: '[ "${GITHUB_REF_NAME#v}" = "$(grep -m1 "^version" backend/Cargo.toml | cut -d\" -f2)" ]'
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Test
        working-directory: backend
        run: cargo test --lib
      - name: Bundle
        working-directory: backend
        run: ./bundle-mac.sh release
      - name: Smoke test
        run: node scripts/smoke.mjs backend/target/bundle/Aditus.app/Contents/MacOS/aditus
      # Secrets: SIGN_IDENTITY, SIGN_CERT_P12 (base64 .p12), SIGN_CERT_PASSWORD; optional notarization:
      # NOTARY_KEY (base64 App Store Connect .p8), NOTARY_KEY_ID, NOTARY_ISSUER. Untested without a certificate.
      - name: Import certificate
        if: env.SIGN_IDENTITY != ''
        env:
          P12: ${{ secrets.SIGN_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain" login.keychain
      - name: Sign
        if: env.SIGN_IDENTITY != ''
        working-directory: backend
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./sign-mac.sh
      - name: Zip
        run: |
          ASSET="Aditus-macos-$(uname -m).zip"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ditto -c -k --keepParent backend/target/bundle/Aditus.app "$ASSET"
      # Detached ed25519 signature over the zip's sha256 hex, checked by the updater against the public key
      # embedded in backend/src/update.rs. Needs secret UPDATE_SIGNING_KEY (PEM); fails the release if absent.
      - name: Sign release zip
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::secret UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned release"; exit 1; }
          brew install openssl@3
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
          shasum -a 256 "$ASSET" | cut -d' ' -f1 | tr -d '\n' > "$RUNNER_TEMP/sha.txt"
          "$(brew --prefix openssl@3)/bin/openssl" pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/update.pem" -in "$RUNNER_TEMP/sha.txt" -out "$ASSET.sig"
          rm -f "$RUNNER_TEMP/update.pem"
          [ "$(wc -c < "$ASSET.sig")" -eq 64 ]
      - uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft: the in-app updater only sees published releases.
          draft: false
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sig
