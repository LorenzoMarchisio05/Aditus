name: ci
on:
  push:
    branches: [main, cef-port]
  pull_request:

jobs:
  # Only macOS is built and run: the CEF port is untested on Windows and Linux.
  test:
    runs-on: macos-latest
    env:
      CEF_PATH: ${{ github.workspace }}/cef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Prebuilt CEF
        run: |
          scripts/fetch-cef.sh "$CEF_PATH"
      - run: brew install ninja
      - run: npm ci
        working-directory: ui
      - run: cargo install cef --version =156.1.0 --features build-util --bin bundle-cef-app
      - name: Test
        working-directory: backend
        run: cargo test --lib
      - name: Bundle (debug)
        working-directory: backend
        run: ./bundle-mac.sh
      - name: Smoke test
        run: node scripts/smoke.mjs backend/target/bundle/Aditus.app/Contents/MacOS/aditus
