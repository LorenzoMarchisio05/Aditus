[package]
name = "aditus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "aditus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
ureq = "2"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSData", "NSDictionary", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["WKContentRuleList", "WKContentRuleListStore", "WKSnapshotConfiguration", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "block2"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_32"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_32"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
